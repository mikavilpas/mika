name: CI

permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-links:
    name: links are valid
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true

  test:
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
      CARGO_TERM_COLOR: always

    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # based on
      # https://github.com/sxyazi/yazi/blob/1a2a18e333de4d92bd83028c808cc9d388b84b60/.github/workflows/test.yml?plain=1#L1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup the mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - name: Setup Rust toolchain
        run: rustup toolchain install nightly --profile minimal
        working-directory: scripts

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: scripts

      - name: Build
        run: cargo build --workspace --verbose
        working-directory: scripts

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        # https://nexte.st/docs/installation/pre-built-binaries/
        name: Install cargo-nextest
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --workspace --verbose --all-features
        working-directory: scripts

  ci:
    runs-on: ubuntu-26.04
    if: always()
    needs:
      # these must pass to allow merging
      - check-links
      - test
    steps:
      - name: Check results
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$HAS_FAILURE" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          if [[ "$HAS_CANCELLED" == "true" ]]; then
            echo "One or more jobs were cancelled"
            exit 1
          fi
          echo "All jobs passed"
